name: Rebuild cleaned manual PDFs (one shot)

on:
  push:
    branches:
      - docs/remove-ctan-from-active-guides-20261020
    paths:
      - .github/workflows/rebuild-manual-pdfs-once.yml

permissions:
  contents: write

jobs:
  update-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          package-file: .github/texlive.packages
      - name: Rebuild English, German and Chinese manuals
        shell: pwsh
        run: ./scripts/build_manual.ps1 -Language all
      - name: Verify rendered PDFs contain no retired distribution wording
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          for lang in en de zh; do
            path="manual/$lang/impe-manual-$lang.pdf"
            test -s "$path"
            if pdftotext "$path" - | grep -Eiq 'ctan|impe-framework'; then
              echo "Retired distribution reference remains in $path"
              exit 1
            fi
          done
      - name: Commit synchronized manual PDFs to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/en/impe-manual-en.pdf manual/de/impe-manual-de.pdf manual/zh/impe-manual-zh.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(manual): rebuild PDFs without retired distribution"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
