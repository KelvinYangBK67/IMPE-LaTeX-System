name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up TeX Live 2026
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          package-file: .github/texlive.packages

      - name: Install PDF regression dependency
        # PDF link destinations and their clickable number rectangles are tested.
        shell: pwsh
        run: python -m pip install PyMuPDF

      - name: Run public regression suite
        shell: pwsh
        run: ./tests/run_regressions.ps1 -PublicFonts

  xsr-integration:
    name: XSR 0.10 integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out IMPE
        uses: actions/checkout@v7

      - name: Set up TeX Live 2026
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          package-file: .github/texlive.packages

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify pinned bundled XSR source against upstream
        shell: pwsh
        run: python scripts/check_xsr_vendor.py

      - name: Install XSR and fetch checksum-verified public reference font
        shell: pwsh
        run: |
          python -m pip install -e vendor/xsr
          python vendor/xsr/scripts/fetch_khitan.py --output assets/fonts/khitan_small/NotoSerifKhitanSmallScript-Regular.ttf
          python vendor/xsr/scripts/fetch_noto.py --output assets/fonts/egyptian/NotoSansEgyptianHieroglyphs-Regular.ttf

      - name: Compile explicit XSR and glyph integration
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace([char]92, [char]47)
          $sep = [IO.Path]::PathSeparator
          $env:TEXINPUTS = "$root/tests/xsr-fixtures//$sep$root/vendor/xsr/tex//$sep$root/package//$sep$root//$sep"
          & xelatex -shell-escape -interaction=nonstopmode -halt-on-error tests/xsr-integration.tex
          if ($LASTEXITCODE -ne 0) { throw 'XSR integration compile failed.' }
          $log = Get-Content xsr-integration.log -Raw
          if ($log -notmatch 'IMPE-TEST-XSR-INTEGRATION-PASS' -or
              $log -notmatch 'XSR-LAYOUT.*script=khitan' -or
              $log -notmatch 'XSR-LAYOUT.*script=egyptian' -or
              $log -notmatch '(?s)IMPE-AUTO-EGYPTIAN-BEGIN.*XSR-LAYOUT script=egyptian.*IMPE-AUTO-EGYPTIAN-END' -or
              $log -notmatch '(?s)IMPE-AUTO-KHITAN-BEGIN.*XSR-LAYOUT script=khitan.*IMPE-AUTO-KHITAN-END' -or
              $log -notmatch 'XSR-INLINE') {
            throw 'XSR integration markers missing.'
          }

      - name: Verify isolated glyphs feature
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace([char]92, [char]47)
          $sep = [IO.Path]::PathSeparator
          $env:TEXINPUTS = "$root/tests/xsr-fixtures//$sep$root/vendor/xsr/tex//$sep$root/package//$sep$root//$sep"
          & xelatex -shell-escape -interaction=nonstopmode -halt-on-error tests/xsr-glyphs-only.tex
          if ($LASTEXITCODE -ne 0) { throw 'Glyphs-only compile failed.' }
          $log = Get-Content xsr-glyphs-only.log -Raw
          if ($log -notmatch 'IMPE-TEST-GLYPHS-ONLY-PASS' -or $log -notmatch 'XSR-INLINE') {
            throw 'Glyphs-only test markers missing.'
          }

      - name: Verify IMPE with XSR 0.10 shell output-directory
        shell: pwsh
        run: |
          # TeX Live 2026 exports TEXMF_OUTPUT_DIRECTORY to XSR's subprocess.
          # Compile a genuine mixed Egyptian/Khitan/glyph document and
          # confirm the bridge writes, reads and cleans in the build directory.
          $root = (Get-Location).Path.Replace([char]92, [char]47)
          $sep = [IO.Path]::PathSeparator
          $env:TEXINPUTS = "$root/tests/xsr-fixtures//$sep$root/vendor/xsr/tex//$sep$root/package//$sep$root//$sep"
          New-Item -ItemType Directory -Force build-xsr | Out-Null
          & xelatex -shell-escape -output-directory=build-xsr -interaction=nonstopmode -halt-on-error tests/xsr-integration.tex
          if ($LASTEXITCODE -ne 0) { throw 'XSR output-directory integration compile failed.' }
          $log = Get-Content build-xsr/xsr-integration.log -Raw
          if ($log -notmatch 'IMPE-TEST-XSR-INTEGRATION-PASS' -or
              $log -notmatch '(?s)IMPE-AUTO-EGYPTIAN-BEGIN.*XSR-LAYOUT script=egyptian.*IMPE-AUTO-EGYPTIAN-END' -or
              $log -notmatch '(?s)IMPE-AUTO-KHITAN-BEGIN.*XSR-LAYOUT script=khitan.*IMPE-AUTO-KHITAN-END' -or
              $log -notmatch 'XSR-INLINE') {
            throw 'XSR output-directory integration markers missing.'
          }
          if (-not (Test-Path build-xsr/xsr-integration.pdf)) {
            throw 'XSR output-directory PDF missing.'
          }
          if ((Test-Path build-xsr/xsr-integration.xsr-request.req) -or
              (Test-Path build-xsr/xsr-integration.xsr-response.tex)) {
            throw 'XSR output-directory shell scratch pair was not cleaned.'
          }

      - name: Smoke-test full bundled IMPE and isolated XSR installation
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace([char]92, [char]47)
          $texmf = Join-Path (Get-Location).Path "tmp/ci-impe-texmf"
          & ./scripts/install.ps1 -TexmfRoot $texmf -NoRefresh
          if ($LASTEXITCODE -ne 0) { throw 'Bundled XSR installer failed.' }
          $venvPython = if ($IsWindows) {
            Join-Path $texmf "scripts/impe/xsr-venv/Scripts/python.exe"
          } else {
            Join-Path $texmf "scripts/impe/xsr-venv/bin/python"
          }
          if (-not (Test-Path $venvPython)) { throw 'Private XSR Python is missing.' }
          & $venvPython -c "import xsr; assert xsr.__version__ == '0.10'"
          if ($LASTEXITCODE -ne 0) { throw 'Private XSR module verification failed.' }
          $install = Join-Path $texmf "tex/latex/impe"
          if (-not (Test-Path (Join-Path $install "impe-xsr-runtime.tex"))) {
            throw 'Generated renderer hook is missing.'
          }
          if (-not (Test-Path (Join-Path $install "xsr/xsr-core.sty"))) {
            throw 'Installed XSR TeX is missing.'
          }
          # Validate from a separate document directory so XeTeX cannot
          # silently pull ./core, ./catalog or ./modules from the checkout.
          # Only test inputs/assets are copied; TEXINPUTS includes installed
          # IMPE (and standard TeX paths), never the source checkout.
          $workspace = Join-Path $root "tmp/ci-installed-xsr/workspace"
          $output = Join-Path $root "tmp/ci-installed-xsr/build"
          New-Item -ItemType Directory -Force $workspace | Out-Null
          New-Item -ItemType Directory -Force $output | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $workspace "tests/fixtures") | Out-Null
          Copy-Item -LiteralPath (Join-Path $root "tests/xsr-installed-only.tex") -Destination $workspace
          Copy-Item -LiteralPath (Join-Path $root "tests/xsr-integration.tex") -Destination $workspace
          Copy-Item -LiteralPath (Join-Path $root "tests/fixtures/xsr-square.svg") -Destination (Join-Path $workspace "tests/fixtures")
          $sep = [IO.Path]::PathSeparator
          $env:TEXINPUTS = "$($install.Replace([char]92,[char]47))//$sep"
          Push-Location $workspace
          try {
            & xelatex -shell-escape "-output-directory=$output" -interaction=nonstopmode -halt-on-error xsr-installed-only.tex
            if ($LASTEXITCODE -ne 0) { throw 'Private XSR launcher selection test failed.' }
            $probeLog = Get-Content (Join-Path $output "xsr-installed-only.log") -Raw
            if ($probeLog -notmatch 'IMPE-PRIVATE-XSR-RUNNER-SELECTED') {
              throw 'Generated private Python runner was not selected.'
            }
            if ($probeLog -match '\(\./(?:core|catalog|modules)/') {
              throw 'Installed-only smoke test accidentally used source-tree IMPE modules.'
            }
            if ($probeLog -notmatch 'impe-xsr-runtime\.tex') {
              throw 'Generated IMPE XSR hook was not read from installed TEXMF.'
            }
            & xelatex -shell-escape "-output-directory=$output" -interaction=nonstopmode -halt-on-error xsr-integration.tex
            if ($LASTEXITCODE -ne 0) { throw 'Installed bundled XSR XeLaTeX compile failed.' }
            $log = Get-Content (Join-Path $output "xsr-integration.log") -Raw
            if ($log -notmatch 'IMPE-TEST-XSR-INTEGRATION-PASS' -or
                $log -notmatch 'XSR-LAYOUT.*script=egyptian' -or
                $log -notmatch 'XSR-LAYOUT.*script=khitan' -or
                $log -notmatch 'XSR-INLINE') {
              throw 'Installed bundled XSR output was not rendered.'
            }
            if ($log -match '\(\./(?:core|catalog|modules)/') {
              throw 'Bundled XSR integration accidentally used source-tree IMPE modules.'
            }
            if ($log -match 'Font declaration .egyptian_local. could not be resolved') {
              throw 'Installed Egyptian font was not resolved.'
            }
            if (-not (Test-Path (Join-Path $output "xsr-integration.pdf"))) {
              throw 'Installed runtime failed to generate the sample PDF.'
            }
          }
          finally {
            Pop-Location
          }

      - name: Save rendering samples for human review
        uses: actions/upload-artifact@v4
        with:
          name: impe-1.0.3-xsr-pdfs-${{ matrix.os }}
          path: |
            xsr-integration.pdf
            xsr-glyphs-only.pdf
          if-no-files-found: error
